name: Clojure CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: "1.11.1.1435"
      - name: Run unit tests
        run: |
          clojure -M:test -e "(require 'clojure.test 'wan27.core-test) (let [res (clojure.test/run-tests 'wan27.core-test)] (when (pos? (+ (:fail res) (:error res))) (System/exit 1)))"
      - name: Verify JAR and POM contents
        run: |
          jar tf target/wan27-clj-0.1.0.jar
          test -f pom.xml
