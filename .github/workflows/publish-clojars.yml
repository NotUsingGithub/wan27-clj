name: Publish to Clojars & cljdoc

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: "1.11.1.1435"
      - name: Run tests before publish
        run: |
          clojure -M:test -e "(require 'clojure.test 'wan27.core-test) (let [res (clojure.test/run-tests 'wan27.core-test)] (when (pos? (+ (:fail res) (:error res))) (System/exit 1)))"
      - name: Configure Maven settings for Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          if [ -z "$CLOJARS_USERNAME" ] || [ -z "$CLOJARS_PASSWORD" ]; then
            echo "CLOJARS_USERNAME or CLOJARS_PASSWORD secret is not set."
            exit 1
          fi
          mkdir -p ~/.m2
          cat <<SETTINGS > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>clojars</id>
                <username>${CLOJARS_USERNAME}</username>
                <password>${CLOJARS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
      - name: Deploy JAR and POM to Clojars
        run: |
          mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.1:deploy-file \
            -Durl=https://repo.clojars.org \
            -DrepositoryId=clojars \
            -Dfile=target/wan27-clj-0.1.0.jar \
            -DpomFile=pom.xml
      - name: Trigger cljdoc documentation build
        run: |
          curl -fsS -X POST https://cljdoc.org/api/request-build2 \
            -d "project=io.github.notusinggithub/wan27-clj" \
            -d "version=0.1.0" || true
